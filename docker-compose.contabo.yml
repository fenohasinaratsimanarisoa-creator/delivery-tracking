
# ─────────────────────────────────────────────────────────────────────────
# Stack auto-hébergée pour un VPS Contabo générique (x86_64 — pas les
# contraintes ARM64 d'Oracle Cloud : postgis/postgis officiel fonctionne
# directement, pas de bidouille de moteur Prisma nécessaire).
#
# HTTPS via Caddy + sslip.io (voir Caddyfile) : pas de domaine acheté, Caddy
# obtient seul un certificat Let's Encrypt pour 169-58-237-88.sslip.io et
# reverse-proxifie vers frontend:80 (qui embarque déjà nginx, voir
# frontend/nginx.conf.template, proxifiant /api et /socket.io vers le backend
# en interne). Le backend est EN PLUS exposé sur 8080 pour un accès API
# direct (debug/tests, en clair, hors chemin Caddy).
#
# OSRM (routage/itinéraires) est OMIS ici : la prod Render actuelle ne l'a
# pas non plus (routing.service.ts renvoie 503 sans fallback public — choix
# RGPD volontaire, voir le commentaire dans ce fichier). Ajout possible plus
# tard en copiant le service "osrm" de docker-compose.oracle.yml.
# ─────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-restart: &restart-policy
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery-tracking-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_tracking}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery_app} -d ${POSTGRES_DB:-delivery_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 2G }
        reservations: { cpus: '0.25', memory: 512M }

  redis:
    image: redis:7-alpine
    container_name: delivery-tracking-redis
    # Redis n'est PAS optionnel malgré son absence de ta liste : verrouillage
    # anti-bruteforce du login, révocation de sessions JWT, rate limiting et
    # la queue BullMQ (calcul carburant, digests email) en dépendent tous.
    # Sans lui l'app démarre mais perd ces protections silencieusement.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }

  traccar:
    image: traccar/traccar:latest
    container_name: delivery-tracking-traccar
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - traccar_data:/opt/traccar/data
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    ports:
      # Interface web admin : liée à 127.0.0.1 UNIQUEMENT (pas exposée à Internet).
      # Docker publie les ports en contournant UFW → le seul moyen fiable de la
      # restreindre est le bind loopback. Le pont Traccar y accède par le réseau
      # Docker interne (http://delivery-tracking-traccar:8082), pas par ce port.
      # Accès humain : tunnel SSH — `ssh -L 8082:localhost:8082 root@<VPS>` puis http://localhost:8082
      - "127.0.0.1:8082:8082"
      - "5055:5055"    # GT06 / Concox / JM-VL03
      - "5056:5056"    # Teltonika FMB / FM / TAVL / GH
      - "5057:5057"    # H02
      - "5058:5058"    # TK103 / TK102 / Coban / ST-901
      - "5059:5059"    # Meitrack
      - "5060:5060"    # OsmAnd
      - "5061:5061"    # Lézard (EZ90/EZ21/EZ630/Delta)
      - "5062:5062"    # WristWatch
      - "5063:5063"    # Naviset / Navtelecom
      - "5064:5064"    # Xexun / Sanav / GStar / GlobalSat
      - "5065:5065"    # AST
    <<: *restart-policy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }
        reservations: { cpus: '0.1', memory: 256M }

  # OSRM auto-hébergé — routage + MAP-MATCHING (accrochage aux rues) du suivi GPS
  # temps réel et de la relecture de trajet. Graphe Madagascar construit à
  # l'image (osrm/Dockerfile, ~10 min au 1er build). Réseau Docker interne
  # uniquement (backend/worker via http://osrm:5000). Conformité DPA : aucun
  # appel à l'OSRM public ni à Google (routing.service.ts n'a aucun fallback).
  osrm:
    build:
      context: ./osrm
      dockerfile: Dockerfile
    image: deliverytrack-osrm:latest
    container_name: delivery-tracking-osrm
    expose:
      - "5000"
    <<: *restart-policy
    logging: *default-logging
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - 'http://localhost:5000/nearest/v1/driving/47.52,-18.88' | grep -q Ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }
        reservations: { cpus: '0.1', memory: 256M }

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deliverytrack-api:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-delivery_tracking}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required — ex. http://<IP-DU-VPS>}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@deliverytrack.app}
      APP_URL: ${APP_URL:?APP_URL is required — ex. http://<IP-DU-VPS>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      TOTP_ISSUER: DeliveryTracking
      FUEL_ANOMALY_THRESHOLD_PERCENT: 20
      # Sans ça, MobileMoneyService.validateSandbox() refuse de démarrer en
      # NODE_ENV=production (voir backend/src/modules/billing/mobile-money.service.ts).
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      MOBILE_MONEY_SANDBOX: ${MOBILE_MONEY_SANDBOX:-false}
      TRACCAR_URL: ${TRACCAR_URL:-http://traccar:8082}
      TRACCAR_USER: ${TRACCAR_USER:?TRACCAR_USER is required}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:?TRACCAR_PASSWORD is required}
      # Traceur physique reconfiguré (2026-09-06) : upload,10 en mouvement.
      # uploadstatic,60 envoyé mais son effet réel est incertain — ce modèle bas
      # de gamme ne répond à aucune commande SMS de requête (fix/check restés
      # sans réponse), et l'observation terrain montre qu'il ne remonte AUCUNE
      # position à l'arrêt (le modem reste "en ligne" mais aucun fix GPS tant
      # que rien ne bouge — comportement motion-triggered probable, pas un bug
      # logiciel). D'abord abaissé à 3 min en supposant uploadstatic effectif,
      # remonté à 15 min (défaut d'origine 10) une fois ce comportement confirmé
      # : sous 3 min, CHAQUE arrêt normal (feu rouge, déchargement) déclencherait
      # une fausse alerte "silence" pendant une livraison réelle.
      TRACKING_SILENCE_TRACKER_MIN: ${TRACKING_SILENCE_TRACKER_MIN:-15}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALERT_SLACK_WEBHOOK: ${ALERT_SLACK_WEBHOOK:-}
      ALERT_DISCORD_WEBHOOK: ${ALERT_DISCORD_WEBHOOK:-}
      ALERT_ON_ERROR: ${ALERT_ON_ERROR:-true}
      # Pas de domaine/TLS : un redirect HTTP→HTTPS forcé bouclerait sur lui-même.
      ENFORCE_HTTPS: 'false'
    ports:
      # Accès direct à l'API (debug/tests + health-check de deploy-contabo.sh via
      # localhost), EN PLUS du /api proxifié par le frontend en interne. Lié à
      # 127.0.0.1 UNIQUEMENT : l'app web ET mobile passent par 443 → Caddy → nginx
      # → backend (réseau Docker), jamais par ce port. Aucune raison de l'exposer
      # à Internet.
      - "127.0.0.1:8080:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traccar:
        condition: service_started
      osrm:
        condition: service_started
    <<: *restart-policy
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: ${BACKEND_REPLICAS:-1}
      resources:
        limits: { cpus: '1', memory: 768M }
        reservations: { cpus: '0.25', memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deliverytrack-api:latest
    container_name: delivery-tracking-worker
    command: ["node", "dist/src/queue/queue.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-delivery_tracking}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # TrackingService (silence GPS) tourne aussi ici, indépendamment du pont —
      # même valeur que "backend" pour que les deux processus s'accordent sur le
      # même seuil (la notification elle-même est dédupliquée via un cooldown
      # Redis partagé, mais un seuil différent d'un process à l'autre resterait
      # trompeur). Voir le commentaire du service "backend" pour le contexte du
      # choix de 15 min (traceur motion-triggered, aucun signal à l'arrêt).
      TRACKING_SILENCE_TRACKER_MIN: ${TRACKING_SILENCE_TRACKER_MIN:-15}
      # PAS de TRACCAR_URL/USER/PASSWORD ici : TraccarBridgeService s'instancie
      # aussi dans ce process (via FuelConsumptionModule → TrackingModule), mais
      # son onModuleInit sort en no-op immédiat grâce à IS_QUEUE_WORKER=1 (posé
      # par queue.worker.ts) — ce process n'a aucun serveur WebSocket, donc une
      # diffusion temps réel faite depuis ici serait silencieusement perdue.
      # Historique : ces 3 variables étaient AVANT nécessaires ici pour que le
      # pont "fonctionne" dans le worker — c'était le bug (le worker pouvait
      # remporter l'élection de leader Redis du pont et bloquer toute diffusion
      # GPS temps réel vers le navigateur). Voir traccar-bridge.service.ts.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      traccar:
        condition: service_started
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Token PUBLIC Mapbox (préfixe pk., fait pour être embarqué côté client,
        # comme une clé Google Maps) — active la couche "Satellite HD" dans le
        # sélecteur de carte. Sans lui, cette couche est simplement absente du
        # sélecteur (voir tileProviders.ts). Restreindre ce token par domaine
        # dans le dashboard Mapbox reste recommandé.
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    image: deliverytrack-web:latest
    container_name: delivery-tracking-web
    environment:
      # Le frontend embarque déjà nginx (frontend/nginx.conf.template) qui
      # proxifie /api et /socket.io vers ce backend en interne — pas besoin
      # d'un nginx séparé devant.
      BACKEND_URL: http://backend:3000
    # Pas de "ports:" ici : Caddy (ci-dessous) est maintenant seul propriétaire
    # des ports 80/443 côté hôte et reverse-proxifie vers frontend:80 en
    # interne (réseau Docker) — évite un conflit de port avec Caddy.
    expose:
      - "80"
    depends_on:
      - backend
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.1', memory: 64M }
    healthcheck:
      # 127.0.0.1 explicite : "localhost" résout en IPv6 (::1) en premier dans ce
      # conteneur, or nginx n'écoute qu'en IPv4 — le healthcheck échouait tout le
      # temps (statut "unhealthy" trompeur, le site fonctionnait pourtant très
      # bien via l'IPv4 réellement exposée). Constaté au premier déploiement réel.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # HTTPS automatique (Let's Encrypt) devant frontend — voir Caddyfile pour le
  # détail (domaine sslip.io, pas d'achat de domaine nécessaire).
  caddy:
    image: caddy:2-alpine
    container_name: delivery-tracking-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }

  backup:
    image: postgis/postgis:16-3.4
    container_name: delivery-tracking-backup
    entrypoint: >
      sh -c "
      apt-get update -qq && apt-get install -y -qq --no-install-recommends awscli cron > /dev/null 2>&1 || true;
      echo '0 3 * * * /backup/backup.sh' > /etc/cron.d/backup;
      crontab /etc/cron.d/backup;
      cron -f
      "
    volumes:
      - ./scripts/backup.sh:/backup/backup.sh:ro
      - backupdata:/backup/data
    environment:
      PGUSER: ${POSTGRES_USER:-delivery_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-delivery_tracking}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *restart-policy
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  traccar_data:
  backupdata:
  caddy_data:
  caddy_config:
