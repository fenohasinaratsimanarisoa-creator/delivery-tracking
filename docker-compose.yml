version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery-tracking-db
    environment:
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pass
      POSTGRES_DB: delivery_tracking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d delivery_tracking"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: delivery-tracking-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: delivery-tracking-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://delivery_user:delivery_pass@postgres:5432/delivery_tracking
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGIN: http://localhost:80
      FUEL_ANOMALY_THRESHOLD_PERCENT: 20
      OSRM_BASE_URL: http://osrm:5000
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  osrm:
    build:
      context: ./osrm
      dockerfile: Dockerfile
    container_name: delivery-tracking-osrm
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/route/v1/driving/0,0;0,0?overview=false || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: delivery-tracking-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  traccar:
    image: traccar/traccar:latest
    container_name: delivery-tracking-traccar
    ports:
      - "8082:8082"    # Web admin interface
      - "5055:5055"    # GT06 protocol (GPS trackers)
      - "5001:5001"    # Alternative port
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - traccar_data:/opt/traccar/data
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8082"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
  traccar_data:
