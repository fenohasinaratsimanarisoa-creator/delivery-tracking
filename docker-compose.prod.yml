
# ⚠️ CORRECTION 2026-09-05 : ce fichier n'est PAS le déploiement de prod réel
# aujourd'hui. La prod actuelle tourne sur un VPS Contabo via
# `docker-compose.contabo.yml` + `scripts/deploy-contabo.sh` (voir ce script
# et DEPLOYMENT.md, qui ne référencent jamais ce fichier). Celui-ci n'a par
# ailleurs AUCUN service Caddy/nginx de terminaison TLS défini plus bas,
# contrairement à `docker-compose.contabo.yml` — s'il est un jour utilisé tel
# quel, `ENFORCE_HTTPS: true` (backend) provoquerait une boucle de redirection
# HTTPS sans certificat réel. Corrigé ci-dessous (repli 'false', pas de faux
# domaine par défaut) pour qu'une utilisation accidentelle échoue proprement
# plutôt que de démarrer dans un état cassé/silencieusement non sécurisé.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-restart: &restart-policy
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: delivery-tracking-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_tracking}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery_app} -d ${POSTGRES_DB:-delivery_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }
        reservations: { cpus: '0.5', memory: 512M }

  redis:
    image: redis:7-alpine
    container_name: delivery-tracking-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deliverytrack-api:latest
    container_name: delivery-tracking-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@deliverytrack.app}
      APP_URL: ${APP_URL:?APP_URL is required (no fictitious default domain)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      TOTP_ISSUER: DeliveryTracking
      FUEL_ANOMALY_THRESHOLD_PERCENT: 20
      # Sans ça, MobileMoneyService.validateSandbox() refuse de démarrer en
      # NODE_ENV=production (voir backend/src/modules/billing/mobile-money.service.ts).
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      MOBILE_MONEY_SANDBOX: ${MOBILE_MONEY_SANDBOX:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALERT_SLACK_WEBHOOK: ${ALERT_SLACK_WEBHOOK:-}
      ALERT_DISCORD_WEBHOOK: ${ALERT_DISCORD_WEBHOOK:-}
      ALERT_ON_ERROR: ${ALERT_ON_ERROR:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # 'false' par défaut : ce compose n'a pas de reverse-proxy TLS (Caddy/nginx)
      # défini plus bas — 'true' sans terminaison HTTPS réelle boucle en redirect.
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *restart-policy
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits: { cpus: '1', memory: 512M }
        reservations: { cpus: '0.25', memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deliverytrack-web:latest
    container_name: delivery-tracking-web
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "80:80"
    depends_on:
      - backend
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.1', memory: 64M }
    healthcheck:
      # 127.0.0.1 explicite : "localhost" résout en IPv6 (::1) en premier dans ce
      # conteneur, or nginx n'écoute qu'en IPv4 — le healthcheck échouait tout le
      # temps (statut "unhealthy" trompeur, le site fonctionnait pourtant très
      # bien via l'IPv4 réellement exposée). Constaté au premier déploiement réel.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Background Jobs ──────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deliverytrack-api:latest
    container_name: delivery-tracking-worker
    command: ["node", "dist/src/queue/queue.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }
        reservations: { cpus: '0.25', memory: 256M }

  # ── Scheduled Backups ────────────────────────────
  backup:
    image: postgis/postgis:16-3.4
    container_name: delivery-tracking-backup
    # postgis/postgis est basé Debian, pas Alpine : "apk"/"crond"/"/etc/crontabs"
    # n'existent pas dessus (correctif — ce bloc échouait silencieusement au
    # démarrage : ce service tournait sans jamais planifier ni exécuter de backup).
    entrypoint: >
      sh -c "
      apt-get update -qq && apt-get install -y -qq --no-install-recommends awscli cron > /dev/null 2>&1 || true;
      echo '0 3 * * * /backup/backup.sh' > /etc/cron.d/backup;
      crontab /etc/cron.d/backup;
      cron -f
      "
    volumes:
      - ./scripts/backup.sh:/backup/backup.sh:ro
      - backupdata:/backup/data
    environment:
      PGUSER: ${POSTGRES_USER:-delivery_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-delivery_tracking}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *restart-policy
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  backupdata:
