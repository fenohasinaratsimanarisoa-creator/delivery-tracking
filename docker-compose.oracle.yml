version: '3.8'

# ─────────────────────────────────────────────────────────────────────────
# Stack auto-hébergée pour Oracle Cloud Always Free (VM Ampere A1, ARM64).
# Regroupe TOUT sur une seule VM : Postgres+PostGIS, Redis, backend (+worker),
# frontend, Traccar (bridge GPS), OSRM (routage), et Caddy en reverse-proxy
# devant le frontend (HTTP pour l'instant, prêt pour HTTPS dès qu'un domaine
# est configuré — voir Caddyfile).
#
# Différences volontaires avec docker-compose.prod.yml (pensé pour Render où
# Postgres/Redis sont des services managés séparés) :
#   - image Postgres : imresamu/postgis (fork communautaire multi-arch) au lieu
#     de postgis/postgis, qui ne publie AUCUNE image arm64 (vérifié sur Docker
#     Hub : postgis/postgis:16-3.4 n'existe qu'en amd64). Même tag "16-3.4",
#     donc compatible avec le schéma/les migrations existants.
#   - Traccar + OSRM ajoutés (absents de docker-compose.prod.yml car gérés à
#     part sur Fly.io / non déployés en prod jusqu'ici).
#   - Caddy ajouté devant le frontend pour centraliser TLS futur.
#   - Pas de ${VAR:?...} obligatoires partout : ce fichier est pensé pour un
#     démarrage guidé (voir DEPLOYMENT.md, section Oracle Cloud) où le .env
#     est copié depuis .env.oracle.example puis complété.
# ─────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-restart: &restart-policy
  restart: unless-stopped

services:
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: delivery-tracking-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-delivery_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-delivery_tracking}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery_app} -d ${POSTGRES_DB:-delivery_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 2G }
        reservations: { cpus: '0.25', memory: 512M }

  redis:
    image: redis:7-alpine
    container_name: delivery-tracking-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 64M }

  osrm:
    build:
      context: ./osrm
      dockerfile: Dockerfile
    image: deliverytrack-osrm:latest
    container_name: delivery-tracking-osrm
    ports:
      - "127.0.0.1:5000:5000"
    <<: *restart-policy
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/route/v1/driving/0,0;0,0?overview=false || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1', memory: 1.5G }
        reservations: { cpus: '0.1', memory: 256M }

  traccar:
    image: traccar/traccar:latest
    container_name: delivery-tracking-traccar
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - traccar_data:/opt/traccar/data
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
    ports:
      - "8082:8082"    # Interface web admin — restreindre via la Security List Oracle si besoin
      - "5055:5055"    # GT06 / Concox / JM-VL03
      - "5056:5056"    # Teltonika FMB / FM / TAVL / GH
      - "5057:5057"    # H02
      - "5058:5058"    # TK103 / TK102 / Coban / ST-901
      - "5059:5059"    # Meitrack
      - "5060:5060"    # OsmAnd
      - "5061:5061"    # Lézard (EZ90/EZ21/EZ630/Delta)
      - "5062:5062"    # WristWatch
      - "5063:5063"    # Naviset / Navtelecom
      - "5064:5064"    # Xexun / Sanav / GStar / GlobalSat
      - "5065:5065"    # AST
    <<: *restart-policy
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }
        reservations: { cpus: '0.1', memory: 256M }

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deliverytrack-api:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-delivery_tracking}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required — ex. http://<IP-de-la-VM> tant qu'il n'y a pas de domaine}
      CSRF_SECRET: ${CSRF_SECRET:?CSRF_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@deliverytrack.app}
      APP_URL: ${APP_URL:?APP_URL is required — ex. http://<IP-de-la-VM> tant qu'il n'y a pas de domaine}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      TOTP_ISSUER: DeliveryTracking
      FUEL_ANOMALY_THRESHOLD_PERCENT: 20
      OSRM_BASE_URL: http://osrm:5000
      TRACCAR_URL: http://traccar:8082
      TRACCAR_USER: ${TRACCAR_USER:-admin}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-admin}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALERT_SLACK_WEBHOOK: ${ALERT_SLACK_WEBHOOK:-}
      ALERT_DISCORD_WEBHOOK: ${ALERT_DISCORD_WEBHOOK:-}
      ALERT_ON_ERROR: ${ALERT_ON_ERROR:-true}
      # Pas de domaine pour l'instant : Caddy ne termine pas de TLS, donc pas de
      # redirect HTTP→HTTPS forcé côté backend (sinon boucle de redirection).
      ENFORCE_HTTPS: ${ENFORCE_HTTPS:-false}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_started
      traccar:
        condition: service_started
    <<: *restart-policy
    logging: *default-logging
    deploy:
      mode: replicated
      replicas: ${BACKEND_REPLICAS:-1}
      resources:
        limits: { cpus: '1', memory: 768M }
        reservations: { cpus: '0.25', memory: 256M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: deliverytrack-api:latest
    container_name: delivery-tracking-worker
    command: ["node", "dist/src/queue/queue.worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-delivery_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-delivery_tracking}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { cpus: '0.1', memory: 128M }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: deliverytrack-web:latest
    container_name: delivery-tracking-web
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 128M }
        reservations: { cpus: '0.1', memory: 64M }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Reverse-proxy : seul service qui publie 80/443 sur l'hôte. HTTP pour
  # l'instant (voir Caddyfile) ; passage en HTTPS = éditer le Caddyfile pour y
  # mettre le nom de domaine, rien d'autre à changer ici.
  caddy:
    image: caddy:2-alpine
    container_name: delivery-tracking-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    <<: *restart-policy
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 128M }

  # ── Background Jobs (backup planifié) ────────────
  backup:
    image: imresamu/postgis:16-3.4
    container_name: delivery-tracking-backup
    # imresamu/postgis (comme postgis/postgis) est basé Debian, pas Alpine :
    # "apk" n'existe pas dessus (correctif — la version précédente de ce bloc,
    # copiée de docker-compose.prod.yml, utilisait "apk" et échouait toujours
    # silencieusement au démarrage du conteneur backup).
    entrypoint: >
      sh -c "
      apt-get update -qq && apt-get install -y -qq --no-install-recommends awscli cron > /dev/null 2>&1 || true;
      echo '0 3 * * * /backup/backup.sh' > /etc/cron.d/backup;
      crontab /etc/cron.d/backup;
      cron -f
      "
    volumes:
      - ./scripts/backup.sh:/backup/backup.sh:ro
      - backupdata:/backup/data
    environment:
      PGUSER: ${POSTGRES_USER:-delivery_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-delivery_tracking}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    <<: *restart-policy
    logging: *default-logging

volumes:
  pgdata:
  redisdata:
  traccar_data:
  backupdata:
  caddy_data:
  caddy_config:
