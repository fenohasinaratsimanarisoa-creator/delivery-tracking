name: Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          curl -sf -o /dev/null -w "API: %{http_code}\n" --connect-timeout 60 https://deliverytrack-api.onrender.com/health || echo "API: ping failed"
      - name: Ping Web frontend
        run: |
          curl -sf -o /dev/null -w "Web: %{http_code}\n" --connect-timeout 60 https://deliverytrack-web.onrender.com/ || echo "Web: ping failed"
