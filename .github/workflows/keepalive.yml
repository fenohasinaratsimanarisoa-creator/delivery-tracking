name: Uptime canary

# La prod tourne sur un VPS Contabo (voir DEPLOYMENT.md) — pas de "cold start"
# à réveiller comme sur l'ancien Render. Ce workflow ne sert plus qu'à détecter
# une panne totale : il ping /health toutes les 15 min et le job ÉCHOUE si la
# prod ne répond pas (visible dans l'onglet Actions + notification au
# propriétaire du repo). Pour de l'alerting temps réel, préférer un moniteur
# externe ou les cron monitors Sentry.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 20 --connect-timeout 30 \
            -o /dev/null -w "health: %{http_code}\n" \
            https://169-58-237-88.sslip.io/api/health
