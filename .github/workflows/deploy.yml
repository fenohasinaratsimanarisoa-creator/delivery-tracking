name: Deploy to Staging/Production

# Déploiement PRODUCTION réel = scripts/deploy-contabo.sh exécuté en SSH sur le
# VPS Contabo (git pull → build → health-gate → migrate → rollback auto).
# Ce workflow-ci ne sert QUE pour le staging Oracle Cloud optionnel et n'est
# donc plus déclenché sur `push` : il tournait à chaque commit et échouait
# systématiquement (GHCR packages:write non accordé, secrets STAGING_* absents),
# polluant le statut CI. Déclenchement manuel uniquement.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      frontend-image: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging (Oracle Cloud — build on host)
    # needs: build-and-push retiré : la VM staging est une VM Oracle Cloud
    # Always Free ARM64 (Ampere A1), les images GHCR ci-dessus sont buildées
    # amd64 par les runners GitHub — inutilisables telles quelles sur cette
    # VM (pas d'émulation QEMU en prod). On construit donc NATIVEMENT sur la
    # VM (docker compose build) plutôt que de "pull" les images GHCR. Voir
    # DEPLOYMENT.md § "Oracle Cloud" pour le détail de ce choix.
    if: github.event.inputs.environment == 'staging'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/delivery-tracking-staging
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.oracle.yml build
            docker compose -f docker-compose.oracle.yml up -d --remove-orphans
            docker image prune -f

      - name: Run database migrations (Staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/delivery-tracking-staging
            docker compose -f docker-compose.oracle.yml exec -T backend npx prisma migrate deploy

      - name: Health check (Staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            sleep 10
            curl -f http://localhost:3000/health || exit 1
            # Port 80 = Caddy (reverse-proxy) -> frontend. L'ancien check visait
            # :5173 (port dev Vite, jamais exposé par la stack Docker) — corrigé.
            curl -f http://localhost/ || exit 1

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    if: github.event.inputs.environment == 'production'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/delivery-tracking-production
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: Run database migrations (Production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/delivery-tracking-production
            docker compose exec -T backend npx prisma migrate deploy

      - name: Health check (Production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            sleep 15
            curl -f http://localhost:3000/health || exit 1
            curl -f http://localhost:5173 || exit 1

      - name: Notify deployment success
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'Production deployment ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}