name: Deploy — Oracle Cloud staging (manuel)

# La PRODUCTION (VPS Contabo) se déploie par `scripts/deploy-contabo.sh` lancé
# en SSH sur le VPS — voir DEPLOYMENT.md. Ce workflow ne couvre QUE
# l'environnement alternatif Oracle Cloud (ARM64), et uniquement sur
# déclenchement manuel.
#
# Pas de job "build & push GHCR" : la VM Oracle est ARM64, les runners GitHub
# sont amd64 — on reconstruit donc NATIVEMENT sur la VM (docker compose build)
# plutôt que de puller des images. Secrets requis (Settings → Secrets →
# Actions) : STAGING_HOST, STAGING_USER, STAGING_SSH_KEY.

on:
  workflow_dispatch:

jobs:
  deploy-oracle-staging:
    name: Deploy to Oracle Cloud (build on host)
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/delivery-tracking
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.oracle.yml build
            docker compose -f docker-compose.oracle.yml up -d --remove-orphans
            docker compose -f docker-compose.oracle.yml exec -T backend npx prisma migrate deploy
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            sleep 10
            curl -f http://localhost:3000/health || exit 1
            curl -f http://localhost/ || exit 1
