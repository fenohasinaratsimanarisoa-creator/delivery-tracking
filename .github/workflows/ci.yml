name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # Backend Jobs
  backend-lint:
    name: Backend - Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  backend-unit-tests:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run unit tests with coverage
        run: npm run test:cov -- --passWithNoTests

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          flags: backend
          fail_ci_if_error: false

  backend-e2e-tests:
    name: Backend - E2E Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        ports: ['5432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: delivery_tracking_test
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/delivery_tracking_test?schema=public
      # Base de TEST dédiée pour les suites d'intégration Traccar (traccar-alert-chain,
      # traccar-postgis) — jamais la production. La CI provisionne postgis/postgis:16-3.4.
      TRACCAR_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/delivery_tracking_test
      JWT_ACCESS_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      REDIS_URL: redis://localhost:6379
      SEED_ADMIN_EMAIL: ci-test@deliverytrack.app
      SEED_ADMIN_PASSWORD: ci-test-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run database migrations
        run: npm run prisma:migrate:prod

      - name: Seed database
        run: npm run prisma:seed
        continue-on-error: true

      - name: Run E2E tests
        run: npm run test:e2e -- --passWithNoTests

      - name: Run Traccar integration tests (against PostGIS test DB)
        run: npx jest traccar-alert-chain traccar-postgis -- --passWithNoTests

  # Frontend Jobs
  frontend-lint:
    name: Frontend - Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc -b --noEmit

  frontend-tests:
    name: Frontend - Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --coverage

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          flags: frontend
          fail_ci_if_error: false

  # Filet de sécurité permanent — fiabilité du tracking GPS (non-régression).
  # Ce job exécute EN UN SEUL RUN toutes les suites dédiées aux invariants
  # critiques du tracking (coupures réseau, backfill Traccar, dead-reckoning
  # jamais en base, session 8h sans fuite, changement de chauffeur). Si un
  # futur changement de code casse l'un de ces comportements, ce job échoue
  # et le build est rouge — AUCUNE régression silencieuse possible.
  tracking-reliability:
    name: Tracking Reliability (non-régression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (backend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate

      - name: Run backend tracking reliability tests
        # NB : rootDir jest = src (package.json) → les patterns sont relatifs à src,
        # sans préfixe src/ (un pattern src/... ne matche jamais et fait échouer le job).
        # Bloc littéral | obligatoire : sans lui YAML replie les lignes en espaces et
        # les backslashes de continuation cassent les patterns (0 match).
        working-directory: ./backend
        run: |
          npx jest --silent \
            modules/tracking/trip-fidelity.spec.ts \
            modules/tracking/traccar-outage-recovery.spec.ts \
            modules/tracking/traccar-backfill.spec.ts \
            modules/tracking/tracking.service.spec.ts \
            modules/tracking/tracking.gateway.spec.ts

      - name: Setup Node.js (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tracking reliability tests
        working-directory: ./frontend
        run: |
          npx vitest run \
            src/services/tracking/tracking-reliability.spec.ts \
            src/services/tracking/deadReckoning.spec.ts \
            src/services/offlineQueue.spec.ts \
            src/services/socket/socket.spec.ts \
            src/hooks/useDriverTracking.spec.ts

  # Build APK release + publication GitHub Release — LE verrou anti-obsolescence.
  # À CHAQUE push sur main : build assembleRelease signé, version incrémentée
  # automatiquement (versionCode = nombre de commits, versionName = patch+1 du
  # dernier tag), SHA-256 calculé, et publication d'une release vX.Y.Z avec 2
  # assets : deliverytrack.apk + manifest.json. L'endpoint backend
  # GET /api/mobile-app/latest lit manifest.json de la dernière release → le
  # fichier proposé correspond TOUJOURS au dernier build produit, jamais un
  # vieux fichier oublié.
  android-release:
    name: Android - Build & Publish APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # capacitor-cordova-android-plugins/ et app/src/main/assets/* sont gitignorés
      # et générés par cap sync : sans cette étape le build échoue en CI
      # (cordova.variables.gradle et capacitor.config.json absents). En mode
      # server.url cap sync ne copie pas les web assets et n'écrit pas la config
      # si le dossier assets n'existe pas — on le crée d'abord.
      - name: Sync Capacitor plugins
        working-directory: ./frontend
        run: |
          mkdir -p android/app/src/main/assets
          npx cap sync android

      - name: Compute next version
        id: version
        working-directory: ./frontend/android
        run: |
          # versionCode = nombre total de commits (strictement croissant, jamais
          # de collision, aucune discipline humaine).
          VERSION_CODE=$(git rev-list --count HEAD)
          # versionName = dernier tag vX.Y.Z avec patch+1 ; 1.0.0 si aucun tag.
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          BASE=${LAST_TAG#v}
          IFS='.' read -r MAJ MIN PATCH <<< "$BASE"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PATCH=${PATCH:-0}
          VERSION_NAME="$MAJ.$MIN.$((PATCH + 1))"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION_NAME (code $VERSION_CODE)"

      - name: Restore signing keystore from secret
        working-directory: ./frontend/android
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing — cannot sign a release APK. "
            echo "::error::Un APK non signé ne doit JAMAIS être distribué. Ajoutez le secret "
            echo "::error::(base64 du .jks) + ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ci-keystore.jks
          ls -la ci-keystore.jks

      - name: Build signed release APK
        working-directory: ./frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/frontend/android/ci-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }}
          ls -la app/build/outputs/apk/release/

      - name: Verify APK is signed
        working-directory: ./frontend/android
        run: |
          # apksigner: vérifie que l'APK est signé avec une vraie clé (pas debug).
          APKSIGNER=$ANDROID_HOME/build-tools/*/apksigner
          $APKSIGNER verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5

      - name: Compute SHA-256 and build manifest.json
        id: sha
        working-directory: ./frontend/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          LAST_TAG: ${{ steps.version.outputs.last_tag }}
        run: |
          SHA256=$(sha256sum app/build/outputs/apk/release/app-release.apk | awk '{print $1}')
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # Changelog : commits depuis le dernier tag (ou tout l'historique au 1er build).
          if [ "$LAST_TAG" != "v0.0.0" ]; then
            CHANGELOG=$(git log --oneline --no-merges "$LAST_TAG"..HEAD | head -30)
          else
            CHANGELOG=$(git log --oneline --no-merges | head -30)
          fi
          cat > manifest.json <<EOF
          {
            "version": "$VERSION_NAME",
            "versionCode": $VERSION_CODE,
            "sha256": "$SHA256",
            "buildDate": "$BUILD_DATE",
            "changelog": $(node -e "console.log(JSON.stringify(process.argv[1]))" "$CHANGELOG")
          }
          EOF
          cat manifest.json
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "build_date=$BUILD_DATE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "DeliveryTrack v${{ steps.version.outputs.version_name }}"
          body: |
            APK chauffeur — build automatique (push sur main).

            - **Version** : v${{ steps.version.outputs.version_name }} (code ${{ steps.version.outputs.version_code }})
            - **SHA-256** : ${{ steps.sha.outputs.sha256 }}
            - **Date de build** : ${{ steps.sha.outputs.build_date }}
          files: |
            frontend/android/app/build/outputs/apk/release/app-release.apk
            frontend/android/manifest.json
          fail_on_unmatched_files: true

      - name: Clean up keystore
        if: always()
        run: rm -f frontend/android/ci-keystore.jks

  # Docker Build Jobs
  build-backend-image:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-unit-tests]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend-image:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-tests]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Summary Job
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-unit-tests
      - backend-e2e-tests
      - frontend-lint
      - frontend-tests
      - tracking-reliability
      - build-backend-image
      - build-frontend-image
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend E2E Tests: ${{ needs.backend-e2e-tests.result }}"
          echo "Frontend Lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Tracking Reliability: ${{ needs.tracking-reliability.result }}"
          echo "Backend Build: ${{ needs.build-backend-image.result }}"
          echo "Frontend Build: ${{ needs.build-frontend-image.result }}"
          
          if [[ "${{ needs.backend-lint.result }}" != "success" ]] ||
             [[ "${{ needs.backend-unit-tests.result }}" != "success" ]] ||
             [[ "${{ needs.backend-e2e-tests.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-lint.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-tests.result }}" != "success" ]] ||
             [[ "${{ needs.tracking-reliability.result }}" != "success" ]] ||
             [[ "${{ needs.build-backend-image.result }}" != "success" ]] ||
             [[ "${{ needs.build-frontend-image.result }}" != "success" ]]; then
            echo "::error::Some CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"